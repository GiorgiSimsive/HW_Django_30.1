version: "3.9"

services:
  web:
    image: ghcr.io/giorgisimsive/hw-django-30-1:latest
    restart: always
    env_file:
      - .env.prod
    ports:
      - "80:8000"
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: hw_django
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Wegodssm1t
    volumes:
      - dbdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: always

  worker:
    image: ghcr.io/giorgisimsive/hw-django-30-1:latest
    command: ["celery", "-A", "myproject", "worker", "-l", "INFO"]
    restart: always
    env_file:
      - .env.prod
    depends_on:
      - db
      - redis

  beat:
    image: ghcr.io/giorgisimsive/hw-django-30-1:latest
    command: ["celery", "-A", "myproject", "beat", "-l", "INFO"]
    restart: always
    env_file:
      - .env.prod
    depends_on:
      - db
      - redis

volumes:
  dbdata:
